# Overlay « IA » : à utiliser avec docker-compose.yml via
#   docker compose -f docker-compose.yml -f compose.ai.yaml --profile ai ...
#
# Il active l'accélération GPU NVIDIA pour le conteneur Ollama.
# Sans ce fichier, Ollama tourne sur CPU (plus lent, mais fonctionne partout).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
