name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_DB: app
          POSTGRES_PASSWORD: mot_de_passe_tres_secret
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, zip
      - name: Get composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist
      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Lint container/twig/yaml
        run: |
          php bin/console lint:container || true
          php bin/console lint:twig templates/ || true
          php bin/console lint:yaml config/ || true
      - name: Migrate and Tests
        run: |
          php bin/console doctrine:migrations:migrate --env=test -n
          vendor/bin/phpunit
