# docker-compose.yml
services:
  scrutinclair-database:
    image: postgres:16-alpine
    environment:
          POSTGRES_DB: ${POSTGRES_DB}
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - scrutinclair-network

  scrutinclair-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/symfony:z
    environment:
      # 0 = aucune génération IA possible (l'app affiche un message d'indisponibilité)
      # 1 = la génération IA est autorisée (Ollama doit tourner)
      AI_ENABLED: "${AI_ENABLED:-1}"
    depends_on:
      - scrutinclair-database
    networks:
      - scrutinclair-network

  scrutinclair-nginx:
    image: nginx:alpine
    ports:
      # Utilise la variable APP_PORT du .env, ou 8000 par défaut si elle est absente
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - scrutinclair-php
    networks:
      - scrutinclair-network

  # Service lourd : il n'est ni construit ni lancé tant que le profil "ai"
  # n'est pas activé (docker compose --profile ai ...).
  # La réservation GPU NVIDIA optionnelle se trouve dans compose.ai.yaml.
  scrutinclair-ollama:
    image: ollama/ollama:latest
    profiles:
      - ai
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - scrutinclair-network

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  db-data:
  ollama-models:

networks:
  scrutinclair-network:
    driver: bridge
