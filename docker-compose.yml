# docker-compose.yml
services:
  scrutinclair-database:
    image: postgres:16-alpine
    environment:
          POSTGRES_DB: ${POSTGRES_DB}
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - scrutinclair-network

  scrutinclair-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Les processus PHP tournent avec l'uid/gid de l'utilisateur hôte (exportés
    # par le Makefile). Les fichiers écrits dans le bind-mount (data/, var/,
    # vendor/) lui appartiennent donc : ils sont supprimables/modifiables côté
    # hôte sans sudo.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/symfony:z
    environment:
      # 0 = aucune génération IA possible (l'app affiche un message d'indisponibilité)
      # 1 = la génération IA est autorisée (Ollama doit tourner)
      AI_ENABLED: "${AI_ENABLED:-1}"
      # L'uid de l'hôte n'a pas d'entrée dans /etc/passwd : sans HOME, composer
      # ne peut pas créer son répertoire de cache et échoue.
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    depends_on:
      - scrutinclair-database
    networks:
      - scrutinclair-network

  scrutinclair-nginx:
    image: nginx:alpine
    ports:
      # Utilise la variable APP_PORT du .env, ou 8000 par défaut si elle est absente
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - scrutinclair-php
    networks:
      - scrutinclair-network

  # Service lourd : il n'est ni construit ni lancé tant que le profil "ai"
  # n'est pas activé (docker compose --profile ai ...).
  # La réservation GPU NVIDIA optionnelle se trouve dans compose.ai.yaml.
  scrutinclair-ollama:
    image: ollama/ollama:latest
    profiles:
      - ai
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - scrutinclair-network

volumes:
  db-data:
  ollama-models:

networks:
  scrutinclair-network:
    driver: bridge
